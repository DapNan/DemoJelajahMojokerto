<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Misi 2 - Pasar | Jelajah Mojokerto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="market-mission-page">

    <!-- KEMBALI -->
    <a href="jelajah.html" class="mission-back">
      ← Kembali
    </a>

    <!-- JUDUL -->
    <div class="market-title">
      <span>MISI 2</span>
      <h1>Belanja Cerdas</h1>
    </div>

    <!-- UANG -->
    <div class="money-card">
      <span>Uangmu:</span>
      <strong id="money">Rp25.000</strong>
    </div>

    <!-- INSTRUKSI -->
    <div class="market-instruction">
      Pilih barang yang kamu butuhkan!
    </div>

    <!-- DAFTAR BARANG -->
    <div class="market-items">

      <button class="market-item"
        onclick="selectItem(this, 'Pisang', 3000)">
        <img src="assets/pisang.png" alt="Pisang">
        <strong>Pisang</strong>
        <span>Rp3.000</span>
      </button>

      <button class="market-item"
        onclick="selectItem(this, 'Sayur', 4000)">
        <img src="assets/sayur.png" alt="Sayur">
        <strong>Sayur</strong>
        <span>Rp4.000</span>
      </button>

      <button class="market-item"
        onclick="selectItem(this, 'Beras', 10000)">
        <img src="assets/beras.png" alt="Beras">
        <strong>Beras</strong>
        <span>Rp10.000</span>
      </button>

      <button class="market-item"
        onclick="selectItem(this, 'Telur', 8000)">
        <img src="assets/telur.png" alt="Telur">
        <strong>Telur</strong>
        <span>Rp8.000</span>
      </button>

    </div>

    <!-- TOTAL -->
    <div class="market-result">

      <span>Total Belanja</span>

      <strong id="total">
        Rp0
      </strong>

    </div>

    <!-- TOMBOL -->
    <button class="market-next" onclick="finishMission()">
      Lanjut
    </button>

  </section>


  <script>

    let totalBelanja = 0;
    const uangAwal = 25000;

    function selectItem(button, nama, harga) {

      /*
       * Kalau barang belum dipilih:
       * tambahkan ke total
       */
      if (!button.classList.contains("selected")) {

        if (totalBelanja + harga > uangAwal) {
          alert("Uangmu tidak cukup untuk membeli barang ini.");
          return;
        }

        totalBelanja += harga;

        button.classList.add("selected");

      } else {

        /*
         * Kalau barang ditekan lagi:
         * batalkan pilihan
         */
        totalBelanja -= harga;

        button.classList.remove("selected");
      }

      updateTotal();
    }


    function updateTotal() {

      document.getElementById("total").textContent =
        "Rp" + totalBelanja.toLocaleString("id-ID");

      const sisa = uangAwal - totalBelanja;

      document.getElementById("money").textContent =
        "Rp" + sisa.toLocaleString("id-ID");
    }


    function finishMission() {

      if (totalBelanja === 0) {
        alert("Pilih barang terlebih dahulu.");
        return;
      }

      alert(
        "Belanja selesai! Total belanja kamu Rp" +
        totalBelanja.toLocaleString("id-ID") +
        "."
      );

      /*
       * Untuk sementara kembali ke peta.
       * Nanti bisa diarahkan ke pertanyaan atau
       * halaman hasil misi.
       */
      window.location.href = "jelajah.html";
    }

  </script>

</body>
</html>
