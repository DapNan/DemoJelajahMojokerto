<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jelajah Mojokerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <a href="index.html" class="back-link">← Kembali</a>
  <img src="assets/logo.png" alt="Jelajah Mojokerto" class="login-logo">
  <div class="speech-bubble">Siap<br>Menjelajahi<br>Mojokerto?</div>

  <div class="login-box">
    <h1>Selamat Datang<br>Penjelajah Muda!</h1>
    <form action="map.html">
      <input type="text" placeholder="Nama/username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Masuk</button>
    </form>
    <p class="register-text">Belum punya akun? <a href="#">Daftar di sini</a></p>
  </div>

  <img src="assets/karakter-membawa-kaca-pembesar.png" alt="Penjelajah muda" class="character-login">
</body>
</html>
